# cargo-about config: only permissive licenses may end up in the app (AGENTS.md section 2).
# Anything else fails `pnpm licenses:update`. Add a license here only after checking it is allowed.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
  "BSL-1.0",
]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
private = { ignore = true }
