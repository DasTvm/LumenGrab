[package]
name = "lumengrab"
version = "0.1.0"
description = "LumenGrab: free, source-available screenshot app"
authors = ["LumenGrab contributors"]
license-file = "../LICENSE"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix is needed to keep the lib name unique from the bin name (Windows issue,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "lumengrab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Windows capture backend. Default: Windows.Graphics.Capture (via xcap).
# `cargo build --no-default-features` falls back to GDI. Has no effect on macOS.
default = ["wgc"]
wgc = ["xcap/wgc"]
# Smoke-test hooks driven by environment variables (see src/dev.rs). Always on in debug builds.
dev-hooks = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
drag = "2"

# macOS: ScreenCaptureKit (macOS 14+) for capture; objc2 for window level and window z-order.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11", features = ["macos_14_0"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSView"] }
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", features = ["CGWindow", "CGEvent"] }

[target.'cfg(target_os = "windows")'.dependencies]
xcap = { version = "0.9.8", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
