name: Release

# Tag `v*` -> installers plus the signed update packages and `latest.json` (what the in-app updater reads),
# attached to a draft GitHub Release in this repo. Publish the draft by hand after writing its notes.
# Manual run (workflow_dispatch) -> installers are only uploaded as workflow artifacts, no release and
# no update packages (docs/UPDATER.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create releases and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal .dmg)
            os: macos-26
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows (NSIS .exe)
            os: windows-2025
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # macOS is signed with a Developer ID certificate and notarized when the repository has the Apple secrets
      # (docs/MACOS_SIGNING.md). Without them the build stays unsigned, exactly as before. Secrets are encrypted
      # by GitHub, never appear in the repository or the logs, and are not given to workflows of forks.
      - name: Look for the Apple signing secrets
        id: apple
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$CERTIFICATE" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        if: steps.apple.outputs.signed != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages of a tag build (docs/UPDATER.md). Never printed, never committed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: LumenGrab ${{ github.ref_name }}
          # The notes of the release are what the update window shows (New / Improved / Fixed), so write
          # them in this shape before publishing the draft, and delete the groups you do not need.
          releaseBody: |
            ### New
            - Describe what is new

            ### Improved
            - Describe what got better

            ### Fixed
            - Describe what was fixed

            First launch: see "First launch" in the README
            (macOS Gatekeeper, Windows SmartScreen).
          releaseDraft: true # review the draft, then publish by hand
          prerelease: false
          uploadUpdaterJson: true # latest.json with the signatures, for the in-app updater
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
          # Update packages (and their signatures) only on a tag: a manual run has no signing key.
          args: ${{ matrix.args }} ${{ github.ref_type == 'tag' && '--config src-tauri/tauri.release.conf.json' || '' }}
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        if: steps.apple.outputs.signed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages of a tag build (docs/UPDATER.md). Never printed, never committed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Developer ID signing and notarization (docs/MACOS_SIGNING.md).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: LumenGrab ${{ github.ref_name }}
          # The notes of the release are what the update window shows (New / Improved / Fixed), so write
          # them in this shape before publishing the draft, and delete the groups you do not need.
          releaseBody: |
            ### New
            - Describe what is new

            ### Improved
            - Describe what got better

            ### Fixed
            - Describe what was fixed

            First launch: see "First launch" in the README
            (macOS Gatekeeper, Windows SmartScreen).
          releaseDraft: true # review the draft, then publish by hand
          prerelease: false
          uploadUpdaterJson: true # latest.json with the signatures, for the in-app updater
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
          # Update packages (and their signatures) only on a tag: a manual run has no signing key.
          args: ${{ matrix.args }} ${{ github.ref_type == 'tag' && '--config src-tauri/tauri.release.conf.json' || '' }}
      # An app folder that is not signed as a whole (only its program carries a signature) is never known to
      # macOS by its bundle id: the Screen Recording switch looks on and is ignored. v0.1.0 had exactly that.
      - name: Check that the macOS app is signed as a whole
        if: runner.os == 'macOS'
        run: |
          dmg=$(find src-tauri/target -name '*.dmg' | head -1)
          test -n "$dmg" || { echo "no dmg found"; exit 1; }
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          app="$mount/LumenGrab.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | tee /tmp/codesign.txt
          grep -q "Identifier=app.lumengrab" /tmp/codesign.txt
          grep -q "Sealed Resources" /tmp/codesign.txt
          hdiutil detach "$mount"
