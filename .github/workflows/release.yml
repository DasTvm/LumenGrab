name: Release

# Tag `v*` -> installers plus the signed update packages and `latest.json` (what the in-app updater reads),
# attached to a draft GitHub Release in this repo. Publish the draft by hand after writing its notes.
# Manual run (workflow_dispatch) -> installers are only uploaded as workflow artifacts, no release and
# no update packages (docs/UPDATER.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create releases and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal .dmg)
            os: macos-26
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows (NSIS .exe)
            os: windows-2025
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages of a tag build (docs/UPDATER.md). Never printed, never committed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: LumenGrab ${{ github.ref_name }}
          # The notes of the release are what the update window shows (New / Improved / Fixed), so write
          # them in this shape before publishing the draft, and delete the groups you do not need.
          releaseBody: |
            ### New
            - Describe what is new

            ### Improved
            - Describe what got better

            ### Fixed
            - Describe what was fixed

            Unsigned build. First launch: see "First launch" in the README
            (macOS Gatekeeper, Windows SmartScreen).
          releaseDraft: true # review the draft, then publish by hand
          prerelease: false
          uploadUpdaterJson: true # latest.json with the signatures, for the in-app updater
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
          # Update packages (and their signatures) only on a tag: a manual run has no signing key.
          args: ${{ matrix.args }} ${{ github.ref_type == 'tag' && '--config src-tauri/tauri.release.conf.json' || '' }}
