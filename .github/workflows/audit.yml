name: Dependency audit

# Known vulnerabilities in the dependencies, once a week and on demand. Not part of CI, so that a new advisory
# does not turn an unrelated change red.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - run: pnpm audit --prod
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      # zip 4.x comes in with tauri-plugin-updater and is only used to unpack an update that was already verified
      # against our signing key (RUSTSEC-2026-0367, 0368, 0369: fixed in zip 9, to follow with the plugin).
      - run: >
          cargo audit --file src-tauri/Cargo.lock
          --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369
