name: Website data feed

on:
  push:
    branches: [main]
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: website-data-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Validate and generate feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/website/project-data-model.test.mjs
          node scripts/website/sync-feed.mjs "$RUNNER_TEMP/website-feed/project-feed.json"
      - name: Publish the last valid snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/feed-publish"
          cd "$RUNNER_TEMP/feed-publish"
          git init -b website-data
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          if git ls-remote --exit-code --heads origin website-data >/dev/null; then
            git fetch origin website-data
            git checkout -B website-data FETCH_HEAD
          fi
          cp "$RUNNER_TEMP/website-feed/project-feed.json" project-feed.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-feed.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: synchronize public website data"
          git push origin website-data
